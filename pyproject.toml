[project]
name = "automotive-ops-intelligence"
version = "0.1.0"
description = "Ranked, costed AI/automation opportunity briefs for a business unit. CrewAI Flow for research, deterministic Python for the arithmetic."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "crewai==1.15.6",
    "pydantic>=2.9",
]

[project.scripts]
automotive-ops-intelligence = "automotive_ops_intelligence.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automotive_ops_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
